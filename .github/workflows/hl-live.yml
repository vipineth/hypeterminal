name: hl-live

on:
  push:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hl-live-${{ github.event_name == 'push' && github.ref || 'testnet' }}
  cancel-in-progress: false

jobs:
  readonly:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.18.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter terminal test hl-live
      - run: bun scripts/hl-live/run.ts --readonly
      - run: bun scripts/hl-live/scan-wire.ts

  testnet:
    if: github.event_name != 'push' && github.ref == 'refs/heads/main'
    environment: hl-testnet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 12.18.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - run: bun scripts/hl-live/run.ts --testnet
        env:
          HL_ENV_FILE: /dev/null
          HL_LIVE_PRINCIPAL_KEY: ${{ secrets.HL_LIVE_PRINCIPAL_KEY }}
          HL_LIVE_AGENT_KEY: ${{ secrets.HL_LIVE_AGENT_KEY }}
      - if: always()
        run: bun scripts/hl-live/run.ts --drift
